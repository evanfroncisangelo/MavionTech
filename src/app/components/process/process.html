<section class="section-padding bg-slate-900">
  <div class="container-max">
    <div class="text-center mb-16">
      <span class="text-cyan-400 text-sm font-semibold uppercase tracking-widest">How We Work</span>
      <h2 class="mt-3 text-4xl font-extrabold font-display text-white">Our Development Process</h2>
      <p class="mt-4 text-lg text-slate-400 max-w-2xl mx-auto">A proven, transparent process that delivers results on time and on budget.</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (step of steps; track step.num) {
        <div class="relative p-8 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition-colors">
          <div class="flex items-center gap-4 mb-5">
            <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">
              {{ step.num }}
            </div>
            <span class="text-xl">{{ step.icon }}</span>
          </div>
          <h3 class="text-xl font-bold text-white mb-3">{{ step.title }}</h3>
          <p class="text-slate-400 leading-relaxed">{{ step.desc }}</p>
        </div>
      }
    </div>
  </div>
</section>
