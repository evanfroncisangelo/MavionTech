<nav [class]="isScrolled() ? 'bg-white/95 backdrop-blur shadow-sm' : 'bg-transparent'"
     class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a href="#home" (click)="scrollTo('#home'); $event.preventDefault()"
         class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        </span>
        <span class="text-xl font-bold font-display"
              [class]="isScrolled() ? 'text-slate-900' : 'text-white'">
          Mavion Tech
        </span>
      </a>

      <!-- Desktop Links -->
      <div class="hidden md:flex items-center gap-8">
        @for (link of navLinks; track link.href) {
          <a (click)="scrollTo(link.href); $event.preventDefault()"
             href="{{link.href}}"
             class="text-sm font-medium transition-colors cursor-pointer"
             [class]="isScrolled() ? 'text-slate-600 hover:text-blue-600' : 'text-white/80 hover:text-white'">
            {{ link.label }}
          </a>
        }
        <a (click)="scrollTo('#contact'); $event.preventDefault()"
           href="#contact"
           class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors cursor-pointer">
          Contact Us
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button (click)="toggleMobile()" class="md:hidden p-2 rounded-lg"
              [class]="isScrolled() ? 'text-slate-900' : 'text-white'">
        @if (!mobileOpen()) {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>
    </div>

    <!-- Mobile Menu -->
    @if (mobileOpen()) {
      <div class="md:hidden bg-white border-t border-slate-100 py-4">
        @for (link of navLinks; track link.href) {
          <a (click)="scrollTo(link.href); $event.preventDefault()"
             href="{{link.href}}"
             class="block px-4 py-3 text-slate-700 hover:text-blue-600 hover:bg-slate-50 font-medium cursor-pointer">
            {{ link.label }}
          </a>
        }
        <div class="px-4 pt-3">
          <a (click)="scrollTo('#contact'); $event.preventDefault()"
             href="#contact"
             class="block w-full text-center px-4 py-2.5 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors cursor-pointer">
            Contact Us
          </a>
        </div>
      </div>
    }
  </div>
</nav>
