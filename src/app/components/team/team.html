<section class="section-padding bg-white">
  <div class="container-max">
    <div class="text-center mb-16">
      <span class="text-blue-600 text-sm font-semibold uppercase tracking-widest">The Team</span>
      <h2 class="mt-3 text-4xl font-extrabold font-display text-slate-900">Meet Our Experts</h2>
      <p class="mt-4 text-lg text-slate-500 max-w-2xl mx-auto">Senior engineers and strategists who are passionate about great software.</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-5xl mx-auto">
      @for (member of team; track member.name) {
        <div class="text-center group">
          <div class="relative mx-auto w-32 h-32 mb-5">
            <div class="w-32 h-32 rounded-2xl bg-gradient-to-br flex items-center justify-center text-5xl shadow-md"
                 [style.background]="member.gradient">
              {{ member.avatar }}
            </div>
          </div>
          <h3 class="font-bold text-slate-900 text-lg">{{ member.name }}</h3>
          <p class="text-blue-600 font-medium text-sm mt-1">{{ member.role }}</p>
          <p class="text-slate-500 text-sm mt-2 leading-relaxed">{{ member.bio }}</p>
          <a [href]="member.linkedin" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center gap-1.5 mt-4 text-sm text-blue-600 hover:text-blue-800 font-medium">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
            LinkedIn
          </a>
        </div>
      }
    </div>
  </div>
</section>
