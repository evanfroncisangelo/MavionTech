<section class="section-padding bg-slate-50">
  <div class="container-max">
    <div class="text-center mb-16">
      <span class="text-blue-600 text-sm font-semibold uppercase tracking-widest">Get In Touch</span>
      <h2 class="mt-3 text-4xl font-extrabold font-display text-slate-900">Contact Us</h2>
      <p class="mt-4 text-lg text-slate-500 max-w-2xl mx-auto">Reach us directly using the contact details below.</p>
    </div>

    <div class="max-w-6xl mx-auto">
      <!-- Contact info -->
      <div class="space-y-8 text-center">
        <div>
          <h3 class="text-xl font-bold text-slate-900 mb-6">Contact Details</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-5xl mx-auto">
            @for (info of contactInfo; track info.label) {
              <a [href]="info.href" class="flex items-center justify-center sm:justify-start gap-4 group rounded-xl border border-slate-200 bg-white px-4 py-3">
                <div class="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center text-xl flex-shrink-0 group-hover:bg-blue-200 transition-colors">
                  {{ info.icon }}
                </div>
                <div class="text-left">
                  <div class="text-xs text-slate-400 font-medium uppercase tracking-wider">{{ info.label }}</div>
                  <div class="text-slate-800 font-semibold group-hover:text-blue-600 transition-colors">{{ info.value }}</div>
                </div>
              </a>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
