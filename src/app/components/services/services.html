<section class="section-padding bg-white">
  <div class="container-max">
    <div class="text-center mb-16">
      <span class="text-blue-600 text-sm font-semibold uppercase tracking-widest">What We Do</span>
      <h2 class="mt-3 text-4xl font-extrabold font-display text-slate-900">Our Services</h2>
      <p class="mt-4 text-lg text-slate-500 max-w-2xl mx-auto">End-to-end software development services tailored for growth-focused businesses.</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (service of services; track service.title) {
        <div class="group p-8 rounded-2xl border border-slate-100 bg-white shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-6" [style.background]="service.bg">
            <span class="text-2xl">{{ service.icon }}</span>
          </div>
          <h3 class="text-xl font-bold text-slate-900 mb-3">{{ service.title }}</h3>
          <p class="text-slate-500 leading-relaxed mb-5">{{ service.desc }}</p>
          <ul class="space-y-1.5">
            @for (f of service.features; track f) {
              <li class="flex items-center gap-2 text-sm text-slate-600">
                <svg class="w-4 h-4 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                {{ f }}
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
