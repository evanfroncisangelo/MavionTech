<section class="section-padding bg-white">
  <div class="container-max">
    <div class="text-center mb-16">
      <span class="text-blue-600 text-sm font-semibold uppercase tracking-widest">Tech Stack</span>
      <h2 class="mt-3 text-4xl font-extrabold font-display text-slate-900">Technologies We Use</h2>
      <p class="mt-4 text-lg text-slate-500 max-w-2xl mx-auto">Best-in-class tools across the full stack.</p>
    </div>
    <div class="space-y-12">
      @for (cat of categories; track cat.name) {
        <div>
          <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-6 text-center">{{ cat.name }}</h3>
          <div class="flex flex-wrap gap-4 justify-center">
            @for (tech of cat.techs; track tech.name) {
              <div class="flex items-center gap-3 px-5 py-3 rounded-xl border border-slate-200 bg-slate-50 hover:border-blue-300 hover:bg-blue-50 transition-colors">
                <span class="text-xl">{{ tech.icon }}</span>
                <span class="font-semibold text-slate-700 text-sm">{{ tech.name }}</span>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
